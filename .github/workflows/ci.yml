name: Data Pipeline CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cultivares_user
          POSTGRES_PASSWORD: cultivares_password
          POSTGRES_DB: cultivares_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run Ruff Linter
      run: |
        ruff check src/ --no-cache

    - name: Run Ruff Formatter
      run: |
        ruff format --check src/ --no-cache

    - name: Run Mypy Type Checker
      run: |
        mypy --ignore-missing-imports --cache-dir /tmp/mypy_cache src/

    - name: Run tests
      env:
        USE_SQLITE: "true"
        PYTHONPATH: "src"
      run: |
        pytest tests/ -v
